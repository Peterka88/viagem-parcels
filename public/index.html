<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parcely – okres Jičín</title>

    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <style>
        html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
        #map { position: absolute; inset: 0; }

        .panel {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 280px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            padding: 12px 16px;
            font-size: 14px;
        }
        .panel h2 { margin: 0 0 8px; font-size: 16px; }
        .panel p { margin: 4px 0; }
        .hint { color: #666; }

        .search { top: 12px; left: auto; right: 56px; width: 240px; }
        .search form { display: flex; flex-direction: column; gap: 8px; }
        .search input, .search select, .search button { font: inherit; padding: 6px 8px; }

        .legend { bottom: 30px; top: auto; width: auto; }
        .legend div { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
        .legend span { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
    </style>
</head>
<body>
<div id="map"></div>

<div class="panel" id="detail">
    <p class="hint">Přibližte mapu a klikněte na parcelu.</p>
</div>

<div class="panel search">
    <h2>Hledat parcelu</h2>
    <form id="search-form">
        <input type="text" id="search-cislo" placeholder="Číslo parcely (např. 123/4)" autocomplete="off">
        <select id="search-druh-cislovani">
            <option value="1">Stavební</option>
            <option value="2" selected>Pozemková</option>
        </select>
        <select id="search-ku">
            <option value="">Načítám k.ú...</option>
        </select>
        <button type="submit">Hledat</button>
    </form>
</div>

<div class="panel legend" id="legend"></div>

<script src="app.js"></script>
</body>
</html>
